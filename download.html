<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Download paper | Hao Zhan</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f8f9f6;color:#232d29;font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
    main{max-width:720px;margin:10vh auto;padding:32px 24px}
    h1{font:400 32px/1.3 Georgia,'Times New Roman',serif;margin:0 0 24px}
    p{margin:0 0 20px}
    a{color:#315c4d;text-underline-offset:4px}
    a:focus-visible{outline:2px solid #315c4d;outline-offset:4px}
    .download{display:inline-block;padding:10px 18px;background:#315c4d;color:#fff;border-radius:3px;text-decoration:none}
    [hidden]{display:none!important}
    .back{margin-top:28px}
  </style>
</head>
<body>
<main>
  <h1 id="paper-title">Download paper</h1>
  <p id="status" role="status">Choose a paper from the homepage to download its PDF.</p>
  <a id="download" class="download" hidden>Download PDF</a>
  <noscript>
    <p>Select a paper to download:</p>
    <ul>
      <li><a href="assets/trajbridge.pdf" download="TrajBridge - Trajectory-Guided Safety Recovery for Multimodal Language Models.pdf">TrajBridge PDF</a></li>
      <li><a href="assets/clear.pdf" download="CLEAR - Cross-Modal Redundancy Control for Multimodal Recommendation.pdf">CLEAR PDF</a></li>
      <li><a href="assets/sea.pdf" download="It is Never Too Late to Mend - Separate Learning for Multimodal Recommendation.pdf">SEA PDF</a></li>
    </ul>
  </noscript>
  <p class="back"><a href="index.html#research">Back to research</a></p>
</main>
<script>
  const papers = {
    trajbridge: { title: 'TrajBridge: Trajectory-Guided Safety Recovery for Multimodal Language Models', file: 'assets/trajbridge.pdf' },
    clear: { title: 'CLEAR: Cross-Modal Redundancy Control for Multimodal Recommendation', file: 'assets/clear.pdf' },
    sea: { title: 'It is Never Too Late to Mend: Separate Learning for Multimodal Recommendation', file: 'assets/sea.pdf' }
  };
  const key = new URLSearchParams(window.location.search).get('paper');
  if (Object.hasOwn(papers, key)) {
    const paper = papers[key];
    const link = document.getElementById('download');
    document.getElementById('paper-title').textContent = paper.title;
    document.title = 'Download ' + paper.title + ' | Hao Zhan';
    document.getElementById('status').textContent = 'Your download should start shortly. If it does not, select Download PDF below.';
    link.href = paper.file;
    link.download = paper.title.replace(':', ' -') + '.pdf';
    link.hidden = false;
    link.click();
  }
</script>
</body>
</html>
